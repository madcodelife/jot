[package]
name = "jot-mcp"
version = "0.1.0"
edition = "2024"
publish = false
description = "A stdio MCP server that lets Claude search, read and add to a Jot notes folder"

[dependencies]
jot-store = { path = "../store" }
rmcp = { version = "3.10", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "io-std"] }

[dev-dependencies]
rmcp = { version = "3.10", features = ["client"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util"] }
