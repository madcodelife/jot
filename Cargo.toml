[package]
name = "nsh-app-jot"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]
members = ["store", "mcp"]

[workspace.dependencies]
# Moving notes to the system trash: Foundation's file manager on macOS
# (jot-store), the `trash` crate elsewhere.
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
trash = "5"

[dependencies]
# NSH's main branch at the commit the `nightly` release was built from, not a release: the open note's ⌘↩ and Return
# need `keymap.bind`'s `overFocused` (NSH #2755), which no release has yet (0.6.0 and 0.6.1 lack it). The `nsh` CLI
# must be the same commit (README, Building). Back to crates.io (`nsh-core = "<version>"`) once a release has it.
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "2964346c285f57004f2531fb768cc9840b8d7ff5" }
# Dictation's `Speech` (TSX: `import { Speech } from "nsh-extra"`), out of NSH's runtime since 0.6 (NSH #2947). NSH
# links a Rust nshm the app's crate depends on; it is here rather than in nsh.json as `nsh add nsh-extra` cannot
# install it from a commit of NSH's repository yet. The same commit as nsh-core, and the same move back to crates.io.
nsh-extra = { git = "https://github.com/longbridge/nsh", rev = "e429ebb4807d221070f54ffdeffe8d3721e887f3", features = ["speech"] }
jot-store = { path = "store" }
jiff = "0.2.43"
# Channels from other threads (the folder watcher, the reminders' thread,
# AppKit's monitors) to tasks on the engine thread.
tokio = { version = "1", default-features = false, features = ["sync"] }
# The AI apps' configuration files (`connect`): edited in place, their keys
# kept in order (JSON) and their comments and layout kept (TOML).
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

# The versions NSH's workspace uses, default features off as there.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { workspace = true, features = [
  "NSDictionary",
  "NSFileManager",
  "NSObject",
  "NSString",
  "NSURL",
  "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSEvent",
  "NSWorkspace",
] }
