  keywords: やること|todo
  group:
    late: 期限切れ
    today: 今日
    tomorrow: 明日
    later: 今後
    none: 日時なし
  empty: 未完了のやることはありません
  tick: 「%{text}」を完了
  row: "%{text}、%{note}"
  due_tip: "%{when} · リマインダー"
  due_change: 「%{text}」のリマインダーの時刻を変更

note:
  invalid_title: 「%{title}」はタイトルに使えません
  create_failed: 「%{title}」を作成できませんでした：%{error}
  rename_taken: 「%{title}」というメモはすでにあります
  rename_failed: 「%{title}」の名前を変更できませんでした：%{error}

paper:
  by_agent: "%{agent} が作成"
  saved: 保存済み
  placeholder: 書き始める…
  label: メモ「%{title}」
  save_failed: 保存できませんでした：%{error}
  appended: 末尾に追記されました。カーソルはそのままです
  conflict: このメモはほかの場所で変更されました
  view_end: 表示 ↓
  use_theirs: あちらを使う
