# 日本語。macOS の用語に合わせる（設定、一般、Finder、ログイン時に開く）。

language:
  system: システムに合わせる

tray:
  new_note: 新規メモ
  summon: Jot を開く（%{keys}）
  todos: やること
  enable_double_tap: "%{keys} の 2 回押しをオンにする…"
  settings: 設定…

notify:
  missed:
    one: リマインダーを %{count} 件見逃しました
    other: リマインダーを %{count} 件見逃しました
  list_separator: 、
  reminders_failed: リマインダーを開始できませんでした：%{error}
  shortcut_taken: "%{keys} はほかのアプリが使用中です。メニューバーの Jot から開いてください"

search:
  placeholder: 検索または新規作成…
  label: メモを検索または新規作成

empty:
  title: メモはまだありません
  first: タイトルを入力して %{keys} を押すと、最初のメモができます。
  agent: AI アプリに「Jot にメモして」と頼むこともできます。

keys:
  actions: アクション

list:
  blank: 空のメモ
  downloading: "ダウンロード中…"
  create: 「%{title}」を作成
  create_hint: Return ですぐに書き始められます
  today:
    one: 今日のやること %{count} 件
    other: 今日のやること %{count} 件
  today_none: 今日のやることはありません
  late:
    one: "期限切れ %{count} 件"
    other: "期限切れ %{count} 件"
  late_title:
    one: "期限切れのやること %{count} 件"
    other: "期限切れのやること %{count} 件"
