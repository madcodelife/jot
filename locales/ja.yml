# 日本語。macOS の用語に合わせる（設定、一般、Finder、ログイン時に開く）。

language:
  system: システムに合わせる

tray:
  new_note: 新規メモ
  summon: Jot を開く（%{keys}）
  todos: やること
  enable_double_tap: "%{keys} の 2 回押しをオンにする…"
  settings: 設定…

notify:
  missed:
    one: リマインダーを %{count} 件見逃しました
    other: リマインダーを %{count} 件見逃しました
