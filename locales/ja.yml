  claude: Claude に「Jot にメモして」と頼むこともできます。

keys:
  open: 開く
  create: 新規
  dismiss: 閉じる
  tick: 完了
  open_note: メモを開く
  back: 戻る

footer:
  notes:
    one: "メモ %{count} 件 · %{folder}"
    other: "メモ %{count} 件 · %{folder}"
  open:
    one: "未完了 %{count} 件"
    other: "未完了 %{count} 件"

list:
  blank: 空のメモ
  create: 「%{title}」を作成
