  remind: リマインダー · %{time} · %{note}
  now: 今
  writing_label: 書き込み中
  locked: ロック中 · Jot でメモのロックを解除するとチェックできます

settings:
  title: 設定
  tabs:
    general: 一般
    summon: 呼び出しとショートカット
    voice: 音声
    appearance: 外観
    reminders: リマインダー
    ai: AI アプリ
    about: 情報
  folder:
    label: メモのフォルダ
    hint: メモは 1 件ずつ、このフォルダの .md ファイルになります。iCloud Drive、Dropbox、Syncthing でフォルダを同期できます。
    change: 変更…
    choose: 選択
    reveal: Finder に表示
    failed: このフォルダを開けませんでした：%{error}
  icloud:
    label: "iCloud Drive"
    move: "iCloud Drive に移動…"
    moving: "移動中…"
    hint: "メモを iCloud Drive に移すと、iPhone、iPad、ほかの Mac でも見られます。"
    off: "iCloud Drive がオフです。「システム設定」›「Apple アカウント」›「iCloud」でオンにしてください。"
    on: "メモは iCloud Drive にあり、ほかのデバイスと同期されます。"
    synced: "iCloud Drive にあります"
    confirm_title: "メモを iCloud Drive に移動しますか？"
    confirm: "%{from} のメモを %{to} に移し、以後 Jot と接続中の AI アプリはそのフォルダを使います。移動先のメモは上書きしません。同じタイトルのメモは番号を付けて保存します。"
    confirm_move: "iCloud Drive に移動"
    cancel: "キャンセル"
    moved:
      one: "%{count} 件のメモを iCloud Drive に移しました。"
      other: "%{count} 件のメモを iCloud Drive に移しました。"
    renamed:
      one: "「%{from}」は移動先のメモと同じタイトルだったので「%{to}」として保存しました。"
      other: "%{count} 件は移動先のメモと同じタイトルだったので、「%{to}」のように番号を付けて保存しました。"
    same:
      one: "%{count} 件は移動先にまったく同じメモがあったので、%{folder} に残しました。"
      other: "%{count} 件は移動先にまったく同じメモがあったので、%{folder} に残しました。"
    failed_some:
      one: "%{count} 件は移動できず、%{folder} に残っています：%{error}"
      other: "%{count} 件は移動できず、%{folder} に残っています：%{error}"
    failed: "iCloud Drive に移動できませんでした：%{error}"
  summon:
    double: "%{key} を 2 回押す"
    on: オン
    grant: 許可…
    fallback: 予備のショートカット
    footnote: "%{key} の 2 回押しには「プライバシーとセキュリティ › アクセシビリティ」で Jot の許可が必要です。使えないときは予備のショートカットで開きます。"
  voice:
    hold: "%{key} 長押しで話す"
    hold_hint: Jot で %{key} を長押しして入力。ほかの App では %{key} を 2 回押して長押しすると、ひとことメモ。
