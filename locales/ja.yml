note:
  invalid_title: 「%{title}」はタイトルに使えません
  create_failed: 「%{title}」を作成できませんでした：%{error}

paper:
  by_claude: Claude が作成
  saved: 保存済み
  placeholder: 書き始める…
  label: メモ「%{title}」
  save_failed: 保存できませんでした：%{error}
  appended: Claude が末尾に追記しました。カーソルはそのままです
  conflict: このメモはほかの場所で変更されました
  view_end: 表示 ↓
  use_theirs: あちらを使う

time:
  just_now: たった今
  minutes_ago:
