  versions_more: "このメモは %{device} でも同時に変更され（%{when}）、iCloud にはほかに %{more} 件の版が残っています。まずこの版：どちらを残しますか？"
  keep_mine: "この Mac の版を残す"
  keep_theirs: "もう一方を使う"
  keep_both: "両方残す"
  copy_title: "%{title}（%{device}）"
  kept_both: "もう一方の版を「%{title}」として保存しました"
