    intro: この Mac の AI アプリを Jot につなぐと、このフォルダのメモを検索・読み込み・追記でき、やることも管理できます。
    apps: この Mac のアプリ
    looking: アプリを探しています…
    none: この Mac に対応する AI アプリが見つかりません。ほかのアプリには下の共通設定を使えます。
    connected: 接続済み
    not_connected: 未接続
    elsewhere: 別のフォルダに接続中
    manual: 手動で設定
    connect: 接続
    disconnect: 接続解除
    update: 更新
    copy: コピー
    copied: コピーしました
    copy_setup: 設定をコピー
    restart: "%{app} を開いている場合は、再起動すると Jot が読み込まれます。"
    no_cli: claude コマンドが見つかりません。コマンドをコピーしてターミナルで実行してください。
    unreadable: "%{file} にコメントがあるか読み込めないため、Jot は変更しません。設定をコピーして追加してください。"
    unsupported: "設定をコピーして %{file} に追加してください。"
    not_moved: まだ前のフォルダに接続されています。Jot からは切り替えられません。
    no_server: Jot の隣に jot-mcp が見つかりません。開発中は「cargo build -p jot-mcp」でビルドしてから、このページを開き直してください。
    translocated: Jot は「ダウンロード」などの一時的な場所から開かれているため、接続してもパスが使えなくなります。先に Jot を「アプリケーション」フォルダにドラッグし、そこから開いてください。
    other: ほかのアプリ
    command: コマンド
    json: 設定
    then: あとはアプリに「Jot にメモして」「今日やることは？」と話しかけるだけです。
    access: 許可
    trash_rewrite: AI アプリにメモのゴミ箱への移動と書き換えを許可
    trash_rewrite_hint: 移動されたメモも、書き換える前のメモもゴミ箱に入るので、そこから戻せます。ロックしたメモは変わりません。
    trash_rewrite_failed: この設定を保存できませんでした：%{error}
  about:
    title: Jot について
    tagline: AI と共有するメモ帳
    version: バージョン %{version}（%{build}）
    built_with: Native Shell で構築
    open: 開く
    themes_credit: テーマの配色は GitHub Theme、One Dark Pro、Atom One Light、Dracula、Tokyo Night、Catppuccin、Gruvbox（MIT）を参考にしています。

