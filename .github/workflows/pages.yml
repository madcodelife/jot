name: Pages

# Publishes the site at https://madcodelife.github.io/jot/: the page in site/, and install.sh at the address README gives.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - install.sh
      - design/logo/loop/web/**
      - design/logo/loop/png/**
      - design/screenshots/**
      - scripts/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as GitHub's starter has it: a deploy right after the upload in one job may not find the artifact yet
  # (actions/deploy-pages#451), and a re-run of that job cannot recover, as it uploads a second one.
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Site
        run: scripts/build-site.sh _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish the site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # The artifact can still be missing from the listing for some seconds: once more, later.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
