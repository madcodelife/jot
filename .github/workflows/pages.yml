name: Pages

# Publishes install.sh at https://madcodelife.github.io/jot/install.sh, the address README gives.
on:
  push:
    branches: [main]
    paths: [install.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, as GitHub's starter has it: a deploy right after the upload in one job may not find the artifact yet
  # (actions/deploy-pages#451), and a re-run of that job cannot recover, as it uploads a second one.
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The site is install.sh, and a page that sends visitors to the repository.
      - name: Site
        run: |
          mkdir site
          cp install.sh site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Jot</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/madcodelife/jot">
          <a href="https://github.com/madcodelife/jot">github.com/madcodelife/jot</a>
          HTML

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publish install.sh
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}install.sh
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # The artifact can still be missing from the listing for some seconds: once more, later.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
