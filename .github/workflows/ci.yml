name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Check and test
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Which NSH
        id: nsh
        run: echo "which=$(scripts/install-nsh.sh --which)" >> "$GITHUB_OUTPUT"

      # A commit of NSH is built from source: keep the build for the next run.
      - uses: actions/cache@v6
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsh.outputs.which }}

      - name: Install NSH
        run: |
          scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: nsh check
        run: nsh check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: nsh test
        run: nsh test

  package:
    name: Package Jot.app (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 90
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      # The runner is Apple silicon: x86_64 is cross-compiled.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.arch }}

      - name: Which NSH
        id: nsh
        run: echo "which=$(scripts/install-nsh.sh --which)" >> "$GITHUB_OUTPUT"

      # A commit of NSH is built from source: keep the build for the next run.
      - uses: actions/cache@v6
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsh.outputs.which }}

      - name: Install NSH
        run: |
          scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Package
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -- --arch "$ARCH" --out dist --build "$GITHUB_RUN_NUMBER"
          # A release tag (v1.2.0) sets the version; otherwise nsh.json's stays.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            set -- "$@" --app-version "${GITHUB_REF_NAME#v}"
          fi
          scripts/package-macos.sh "$@"
          # Every executable is for this architecture only.
          for file in dist/Jot.app/Contents/MacOS/*; do
            archs=$(lipo -archs "$file" 2> /dev/null) || continue
            echo "$file: $archs"
            [ "$archs" = "$ARCH" ] || { echo "::error::$file is $archs, not $ARCH"; exit 1; }
          done

      - name: Zip
        id: zip
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            label="$GITHUB_REF_NAME"
          else
            label="$(git rev-parse --short HEAD)"
          fi
          zip="Jot-$label-macos-$ARCH.zip"
          ditto -c -k --keepParent dist/Jot.app "dist/$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.zip.outputs.zip }}
          path: dist/${{ steps.zip.outputs.zip }}
          if-no-files-found: error

  # A release tag: one release with both packages, once both are built.
  release:
    name: Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Jot ${GITHUB_REF_NAME#v}" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
