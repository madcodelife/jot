name: CI

on:
  push:
    branches: [main]
  # `closed` is here only to stop the pull request's run once it merges or closes: that run joins the same group and
  # cancels it, and runs no job itself.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A pull request's runs are grouped by its number: once it merges, `github.ref` of the `closed` run is `main`'s, and
# grouping by it would cancel `main`'s run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request is checked and tested before it merges. On `main` it runs again: what it saves is the cache every
  # pull request starts from. A release tag is packaged in `release.yml`.
  #
  # Caches: a pull request can only restore those of its own branch and of `main`, and the repository keeps 10 GB of
  # them. So only `main` saves (the Rust builds, ~1 GB a job, and the NSH build), and pull requests restore them.
  test:
    name: Check and test
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Which NSH
        id: nsh
        run: echo "which=$(scripts/install-nsh.sh --which)" >> "$GITHUB_OUTPUT"

      # A commit of NSH is built from source. Without a build of that commit, an older one is restored: the script
      # checks the new commit out over it and cargo rebuilds only what changed.
      - uses: actions/cache/restore@v6
        id: nsh-cache
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsh.outputs.which }}
          restore-keys: nsh-${{ runner.os }}-${{ runner.arch }}-

      - name: Install NSH
        id: install-nsh
        run: |
          scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: nsh check
        run: nsh check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: nsh test
        run: nsh test

      # After the tests, so the runtimes `nsh test` built into the checkout are kept too; even when they fail.
      - uses: actions/cache/save@v6
        if: >-
          always() && github.ref == 'refs/heads/main' && steps.install-nsh.outcome == 'success'
          && steps.nsh-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.nsh
          key: ${{ steps.nsh-cache.outputs.cache-primary-key }}
