name: CI

on:
  push:
    branches: [main]
  # `closed` is here only to stop the pull request's run once it merges or closes: that run joins the same group and
  # cancels it, and runs no job itself.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# A pull request's runs are grouped by its number: once it merges, `github.ref` of the `closed` run is `main`'s, and
# grouping by it would cancel `main`'s run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request is checked and tested before it merges. On `main` it runs again: what it saves is the cache every
  # pull request starts from. A release tag is packaged in `release.yml`.
  #
  # Caches: a pull request can only restore those of its own branch and of `main`, and the repository keeps 10 GB of
  # them. So only `main` saves (the Rust builds, the NSH build and the builds of `nsh check` and `nsh test`), and pull
  # requests restore them.
  test:
    name: Check and test
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Which NSH
        id: nsh
        run: echo "which=$(scripts/install-nsh.sh --which)" >> "$GITHUB_OUTPUT"

      # A commit of NSH is built from source, by a toolchain: a new Rust rebuilds all of NSH (27 minutes), so the key
      # has both, or a build of the commit by the old Rust is restored, built again and never saved. Without a build
      # of that commit by this Rust, an older one is restored: the script checks the new commit out over it and cargo
      # rebuilds only what changed.
      - uses: actions/cache/restore@v6
        id: nsh-cache
        with:
          path: ~/.nsh
          key: nsh-${{ runner.os }}-${{ runner.arch }}-${{ steps.nsh.outputs.which }}-${{ steps.toolchain.outputs.cachekey }}
          restore-keys: nsh-${{ runner.os }}-${{ runner.arch }}-

      - name: Install NSH
        id: install-nsh
        run: |
          scripts/install-nsh.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: rustfmt
        run: cargo fmt --all --check

      # What `nsh check` and `nsh test` build goes to a target of its own, cached apart from `target/`: the headless
      # runner of `nsh test` is a workspace NSH generates in `.nsh/rust`, with crates the app's do not use (the test
      # engine, the JS runtime), and rust-cache keeps in `target/` only the crates of the app's own workspace. It built
      # the runner from nothing on every run, 6 of the 13 minutes. Restored only for the same toolchain, crates and
      # NSH (its commit is in Cargo.lock), so the cache never gathers old builds; `.nsh/rust/Cargo.lock` with it, so
      # the runner resolves to the crates built. NSH reads `CARGO_TARGET_DIR` for every build it runs.
      - uses: actions/cache/restore@v6
        id: nsh-target
        with:
          path: |
            ${{ runner.temp }}/nsh-target
            .nsh/rust/Cargo.lock
          key: >-
            nsh-target-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.cachekey }}-${{
            hashFiles('Cargo.lock', 'Cargo.toml', 'store/Cargo.toml', 'mcp/Cargo.toml', 'nsh.json') }}

      - name: nsh check
        run: nsh check
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nsh-target

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: nsh test
        id: nsh-test
        run: nsh test
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/nsh-target

      # After the tests, so the runtimes `nsh test` built into the checkout are kept too; even when they fail.
      - uses: actions/cache/save@v6
        if: >-
          always() && github.ref == 'refs/heads/main' && steps.install-nsh.outcome == 'success'
          && steps.nsh-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.nsh
          key: ${{ steps.nsh-cache.outputs.cache-primary-key }}

      # Once `nsh test` built the runner, even when tests fail.
      - uses: actions/cache/save@v6
        if: >-
          always() && github.ref == 'refs/heads/main' && steps.nsh-target.outputs.cache-hit != 'true'
          && (steps.nsh-test.outcome == 'success' || steps.nsh-test.outcome == 'failure')
        with:
          path: |
            ${{ runner.temp }}/nsh-target
            .nsh/rust/Cargo.lock
          key: ${{ steps.nsh-target.outputs.cache-primary-key }}
