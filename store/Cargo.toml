[package]
name = "jot-store"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Jot's notes folder: format, listing, search, to-dos, atomic writes and folder watching"

[dependencies]
jiff = "1.0.0"
notify-debouncer-mini = "0.8"
tempfile = "3"
serde_json = "1"
# A note's icon is one emoji: one grapheme cluster, an emoji character.
unicode-segmentation = "1.13"
unicode-properties = { version = "0.1.5", default-features = false, features = ["emoji"] }
# Search matches a Chinese title by its pinyin (`hanzi`): readings without tones, every reading of a character.
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The trash, and iCloud Drive: downloading a note, the versions kept in a conflict.
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSFileVersion",
  "NSString",
  "NSURL",
  "NSValue",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash.workspace = true

[dev-dependencies]
tempfile = "3"
