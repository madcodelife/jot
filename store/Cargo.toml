[package]
name = "jot-store"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Jot's notes folder: format, listing, search, to-dos, atomic writes and folder watching"

[dependencies]
jiff = "0.2.43"
notify-debouncer-mini = "0.7"
tempfile = "3"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
# The trash, and iCloud Drive: downloading a note, the versions kept in a conflict.
objc2-foundation = { workspace = true, features = [
  "NSArray",
  "NSDate",
  "NSEnumerator",
  "NSError",
  "NSFileManager",
  "NSFileVersion",
  "NSString",
  "NSURL",
  "NSValue",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash.workspace = true

[dev-dependencies]
tempfile = "3"
